<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Tengo una pregunta para ti!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e8dff5 0%, #fce1e4 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.93);
            border: 4px solid #b39ddb;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0px 10px 30px rgba(126, 87, 194, 0.2);
            max-width: 450px;
            width: 90%;
            z-index: 10;
        }

        h1 {
            color: #4a148c;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        p {
            color: #6a1b9a;
            font-size: 1.1rem;
        }

        /* Contenedor del sprite de Espeon / Gato */
        .sprite-container {
            margin: 20px 0;
            position: relative;
            height: 150px;
        }

        .sprite {
            width: 130px;
            animation: bounce 1.5s infinite alternate ease-in-out;
        }

        /* Animación saltarina estilo Pokémon */
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-15px); }
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            position: relative;
            height: 50px;
        }

        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #btn-si {
            background-color: #7e57c2;
            color: white;
            box-shadow: 0 4px 15px rgba(126, 87, 194, 0.4);
        }

        #btn-si:hover {
            transform: scale(1.1);
            background-color: #673ab7;
        }

        #btn-no {
            background-color: #e0e0e0;
            color: #757575;
            position: absolute;
        }
    </style>
    <!-- Incluye una librería externa para lanzar confeti al aceptar -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div class="container">
        <!-- Puedes cambiar este texto por un apodo lindo si tienes uno -->
        <h1>¡Un Espeon salvaje ha aparecido!</h1>
        <p>Y trae un mensaje muy importante de mi parte...</p>
        
        <div class="sprite-container">
            <!-- Imagen de Espeon o Purrloin (puedes usar un gif oficial de pokemondb o similar) -->
            <img class="sprite" src="https://pokemondb.net" alt="Espeon">
        </div>

        <p style="font-weight: bold; font-size: 1.3rem; margin-top: 10px;">¿Quieres ser mi novia? 💜</p>

        <div class="btn-container">
            <button id="btn-si" onclick="aceptarPropuesta()">¡SÍ!</button>
            <button id="btn-no" onmouseover="moverBotonNo()" onclick="moverBotonNo()">No</button>
        </div>
    </div>

    <script>
        // Inicializa la posición predeterminada del botón NO
        const btnNo = document.getElementById('btn-no');
        btnNo.style.left = '60%'; 

        function moverBotonNo() {
            // Genera posiciones aleatorias dentro de la pantalla para esquivar el cursor
            const x = Math.random() * (window.innerWidth - btnNo.offsetWidth - 40) + 20;
            const y = Math.random() * (window.innerHeight - btnNo.offsetHeight - 40) + 20;
            
            // Saca el botón de su contenedor original y lo mueve por todo el body
            document.body.appendChild(btnNo);
            btnNo.style.position = 'absolute';
            btnNo.style.left = x + 'px';
            btnNo.style.top = y + 'px';
        }

        function aceptarPropuesta() {
            // Lanza una lluvia de confeti morado y rosa usando la librería
            confetti({
                particleCount: 150,
                spread: 80,
                colors: ['#7e57c2', '#b39ddb', '#fce1e4', '#ea80fc']
            });

            // Cambia el diseño de la tarjeta para mostrar el mensaje final de victoria
            document.querySelector('.container').innerHTML = `
                <h1>¡Felicidades! 🎉</h1>
                <p>¡Has atrapado a tu novio programador ideal!</p>
                <div class="sprite-container">
                    <img class="sprite" src="https://pokemondb.net" alt="Delcatty Feliz">
                </div>
                <p style="color: #4a148c; font-weight: bold; font-size: 1.2rem;">Prometo ser el mejor compañero de equipo. ¡Te quiero! ✨</p>
            `;
        }
    </script>
</body>
</html>
